<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div>
        <h1><img src="img/LogoGL1.png" alt="" height="30">GlowLab</h1> 
        <p><marquee width="449">Discover Your Perfect Glow</marquee></p>
        </div>
    
      <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="product.html" target="frameIsi">Product</a></li>
            <li><a href="category.html" target="frameIsi">Category</a></li>
            <li><a href="about.html" target="frameIsi">About</a></li>
            <li><a href="https://wa.me/6282350705121">Contact</a></li>
        </ul>
      </nav>
    </header>





    <div class="signup-container">

        <form action="index.html" method="post">

            <div class="input-group">
                <label>Email</label><br>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <br>

            <div class="input-group">
                <label>Password</label><br>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <br>

            <div class="remember">
                <label>
                    <input type="checkbox" name="remember">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <br>

            <input type="submit" value="Sign Up" class="btn-signup">


        </form>

    </div>

</body>
</html>
